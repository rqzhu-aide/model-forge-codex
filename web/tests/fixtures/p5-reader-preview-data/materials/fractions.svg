<svg xmlns="http://www.w3.org/2000/svg" width="640" height="290" viewBox="0 0 640 290" role="img" aria-labelledby="title desc"><title id="title">Exact synthetic fractions</title><desc id="desc">Case A has fraction 0.125 and Case B has fraction 0.250.</desc><rect width="640" height="290" fill="white"/><g font-family="Georgia,serif" font-size="17" fill="#20242c"><text x="320" y="27" text-anchor="middle">Exact fractions in two synthetic sets</text><path d="M90 50V230H610" fill="none" stroke="#20242c"/><text x="80" y="235" text-anchor="end">0</text><text x="80" y="147" text-anchor="end">0.125</text><text x="80" y="60" text-anchor="end">0.250</text><text x="250" y="265" text-anchor="middle">Case A</text><text x="450" y="265" text-anchor="middle">Case B</text><rect x="200" y="142.5" width="100" height="87.5" fill="#2c5c87"/><rect x="400" y="55" width="100" height="175" fill="#2c5c87"/></g></svg>