[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "model-forge-codex"
version = "0.9.0"
description = "Model Forge (Codex edition): researcher-directed multi-agent scientific method pipeline on the OpenAI Codex harness."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "jsonschema>=4.20",
    "httpx>=0.27",
    "openai-codex>=0.147,<0.148",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
